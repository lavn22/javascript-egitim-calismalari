<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Dikdörtgenin alanı ve çevresi  
        var kisaKenar,uzunKenar,alan,cevre;
        kisaKenar=Number(prompt("Kısa kenar uzunluğunu girin:"));
        uzunKenar=Number(prompt("Uzun kenar uzunluğunu girin:"));
        alan=kisaKenar*uzunKenar;
        cevre=2*(kisaKenar+uzunKenar);
        document.write("Alan="+alan+"<br>");
        document.write("Çevre=",cevre);
    </script>
</body>
</html>
