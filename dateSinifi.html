<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var an=new Date();
        document.write(an+"<br>");
        document.write(an.toLocaleString()+"<br>");
        document.write("Yıl: "+an.getFullYear()+"<br>");
        document.write("Ay: "+an.getMonth()+"<br>");
        document.write("Gün: "+an.getDate()+"<br>");
        document.write("Hafta Günü: "+an.getDay()+"<br>");
        document.write("Saat: "+an.getHours()+"<br>");
        document.write("Dakika: "+an.getMinutes()+"<br>");
        document.write("Saniye: "+an.getSeconds()+"<br>");
    </script>
</body>
</html>
