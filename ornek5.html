<body>
    <script>
    //Kullanıcıdan alınan 3 sayının ortalamasını bulma
    var s1,s2,s3,ort;
    s1=Number(prompt("1.sayıyı girin:"));
    s2=Number(prompt("2.sayıyı girin:"));
    s3=Number(prompt("3.sayıyı girin:"));
    ort=(s1+s2+s3)/3;
    alert("Sayıların ortalaması= "+ort);

    </script>
    
</body>
