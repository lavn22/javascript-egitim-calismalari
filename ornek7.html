<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Girilen sıcaklık değerine göre havanın sıcak/soğuk/normal olmasını yazma
        var sicaklik;
        sicaklik=Number(prompt("Sıcaklık değerini giriniz:"));
        if(sicaklik>=25){
            alert("Sıcak");
        }
        else if(sicaklik>=10 && sicaklik<25){
            alert("Normal");
        }
        else{
            alert("Soğuk");
        }
    </script>
</body>
</html>
