<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var sayilar=[1,9,8,4,5,7];
        document.write("dizi: "+sayilar+"<br>");
        document.write("eleman sayısı= "+sayilar.length+"<br>");
        sayilar.sort();
        document.write("Sıralanmış dizi: "+sayilar+"<br>");
        sayilar.reverse();
        document.write("Ters çevrilmiş dizi: "+sayilar+"<br>");
        sayilar.push(20);
        document.write("dizi: "+sayilar+"<br>");
        sayilar.unshift(99);
        document.write("dizi: "+sayilar+"<br>");
        document.write(sayilar.shift()+"<br>");
        document.write("dizi: "+sayilar+"<br>");
        document.write(sayilar.pop()+"<br>");
        document.write("dizi: "+sayilar+"<br>");


    </script>
</body>
</html>
